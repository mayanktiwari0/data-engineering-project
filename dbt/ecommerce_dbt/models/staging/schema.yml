version: 2

models:

  - name: stg_customers
    description: "Staging model for customer data"

    columns:
      - name: customer_id
        description: "Unique identifier for each customer"
        data_tests:
          - not_null
          - unique

      - name: customer_name
        description: "Customer name"

      - name: email
        description: "Customer email address"

      - name: city
        description: "Customer city"

      - name: state
        description: "Customer state"

      - name: signup_date
        description: "Date when the customer signed up"


  - name: stg_orders
    description: "Staging model for order data"

    columns:
      - name: order_id
        description: "Unique identifier for each order"
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer associated with the order"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_date
        description: "Date when the order was placed"

      - name: order_status
        description: "Current status of the order"


  - name: stg_order_items
    description: "Staging model for order item data"

    columns:
      - name: order_item_id
        description: "Unique identifier for each order item"
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Order associated with the item"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        description: "Product associated with the order item"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: quantity
        description: "Number of units purchased"

      - name: unit_price
        description: "Price per unit"


  - name: stg_payments
    description: "Staging model for payment data"

    columns:
      - name: payment_id
        description: "Unique identifier for each payment"
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Order associated with the payment"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: payment_date
        description: "Date when the payment was made"

      - name: payment_method
        description: "Method used for payment"

      - name: payment_status
        description: "Status of the payment"

      - name: amount
        description: "Payment amount"


  - name: stg_products
    description: "Staging model for product data"

    columns:
      - name: product_id
        description: "Unique identifier for each product"
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: "Product name"

      - name: category
        description: "Product category"

      - name: subcategory
        description: "Product subcategory"

      - name: unit_price
        description: "Product unit price"